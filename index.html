<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050a1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>مختبر روبو VR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#050a1a; --card:rgba(13,24,56,.9); --ink:#eef4ff; --muted:#a9bde3; --accent:#38e1ff; --go:#18b86b; --alt:#2e4a8a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:var(--bg); color:var(--ink); font-family:Cairo, system-ui, sans-serif; overflow:hidden; touch-action:none; -webkit-user-select:none; user-select:none; }
  #app canvas { display:block; position:fixed; inset:0; }
  #menu { position:fixed; inset:0; z-index:10; display:flex; align-items:center; justify-content:center; padding:16px; overflow:auto;
          background:radial-gradient(circle at 50% 25%, #16347a 0, #050a1a 70%); }
  #menu[hidden], #warn[hidden] { display:none !important; }
  .card { margin:auto; width:100%; max-width:520px; background:var(--card); border:2px solid rgba(56,225,255,.35); border-radius:24px; padding:22px 18px; text-align:center; }
  .logo { font-size:56px; line-height:1; }
  h1 { font-size:28px; font-weight:800; margin-top:6px; }
  .sub { color:var(--muted); font-size:16px; margin-top:2px; }
  ol { text-align:right; margin:16px 22px 6px 0; font-size:16px; line-height:1.9; }
  .btn { display:block; width:100%; border:0; border-radius:16px; padding:14px; margin-top:12px; font:800 20px Cairo, sans-serif; color:#fff; background:var(--go); cursor:pointer; }
  .btn.alt { background:var(--alt); font-size:17px; }
  .btn:disabled { opacity:.5; cursor:wait; }
  label.opt { display:flex; gap:8px; align-items:center; justify-content:center; margin-top:12px; color:var(--muted); font-size:15px; }
  #exit { position:fixed; top:6px; left:50%; transform:translateX(-50%); z-index:6; display:none; border:0; border-radius:12px; padding:4px 12px;
          background:rgba(0,0,0,.45); color:#fff; font:600 13px Cairo, sans-serif; opacity:.6; }
  #divider { position:fixed; top:0; bottom:0; left:50%; width:2px; margin-left:-1px; background:#000; z-index:5; display:none; pointer-events:none; }
  #rotate { position:fixed; inset:0; z-index:7; display:none; align-items:center; justify-content:center; flex-direction:column; gap:10px; background:var(--bg); font-size:22px; font-weight:800; }
  body.vr #exit, body.vr #divider { display:block; }
  .fit { margin-top:16px; padding-top:12px; border-top:1px solid rgba(56,225,255,.25); text-align:right; }
  .fit-title { font-weight:800; font-size:17px; text-align:center; margin-bottom:6px; }
  .fit label { display:block; margin-top:10px; font-size:15px; }
  .fit input[type=range] { width:100%; margin-top:4px; accent-color:var(--accent); }
  .fit small { display:block; color:var(--muted); font-size:13px; }
  @media (orientation:portrait) { body.vr #rotate { display:flex; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app"></div>
<div id="divider"></div>
<button id="exit">✕ خروج</button>
<div id="rotate"><div style="font-size:60px">📱↻</div>لفّ الموبايل بالعرض</div>

<div id="warn" hidden style="position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(5,10,26,.92)">
  <div class="card">
    <div class="logo">⚠️</div>
    <h1 style="font-size:22px">حركة الراس مش شغّالة</h1>
    <p id="warnMsg" style="margin-top:10px;line-height:1.9"></p>
    <button class="btn alt" id="warnOk">كمّل باللمس (اسحب بإصبعك لتلف)</button>
  </div>
</div>
<div id="menu">
  <div class="card">
    <div class="logo">🤖</div>
    <h1>مختبر روبو VR</h1>
    <p class="sub">مغامرة تفاعلية بعالم الروبوتات والبرمجة · 8–12 سنة</p>
    <ol>
      <li>حط الموبايل بالعرض جوّا النظارة.</li>
      <li>دوّر راسك لتشوف كل المختبر، قدّام ووراك وفوق 👀</li>
      <li>لتكبس على أي زر، ثبّت النقطة البيضا عليه ثانية ونص.</li>
    </ol>
    <button class="btn" id="startVR" disabled>⏳ عم يحمّل...</button>
    <button class="btn alt" id="startMono" disabled>⏳ عم يحمّل...</button>
    <label class="opt"><input type="checkbox" id="tts" checked> روبو يحكي بصوت (إذا الموبايل بيدعم العربي)</label>
    <div class="fit">
      <div class="fit-title">🥽 ضبط النظارة</div>
      <label>المسافة بين الصورتين <b id="sepVal"></b>
        <input type="range" id="sep" min="30" max="50" step="1">
        <small>شايف صورتين أو بترتاح بعين وحدة؟ صغّرها ⬅</small>
      </label>
      <label>قوة الـ 3D <b id="depthVal"></b>
        <input type="range" id="depth" min="0" max="70" step="5">
        <small>إذا تعبت عيونك، خففها ⬅</small>
      </label>
      <label>ثبات الحركة <b id="smoothVal"></b>
        <input type="range" id="smooth" min="0" max="100" step="10">
        <small>الصورة عم ترجف؟ زيدها ➡ · حاسس فيها تأخير؟ خففها ⬅</small>
      </label>
      <button class="btn alt" id="fitReset" style="font-size:15px;padding:8px">↺ رجّع الضبط الأصلي</button>
      <label style="display:flex;gap:8px;align-items:center;justify-content:center;margin-top:10px">
        <input type="checkbox" id="gyro"> جرّب حساس الجيروسكوب (تجريبي، إذا لسا في هزّة)
      </label>
      <small id="sensorInfo" style="display:block;text-align:center;margin-top:8px"></small>
    </div>
  </div>
</div>
